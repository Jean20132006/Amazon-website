<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="styles/navbar.css">
    <!--BootStrap CSS link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!--CSS link-->
    <!--BootStrap Icons link-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="nav-bar">
        <div class="amazon-logo-container">
            <a href="amazon.html">
                <div class="amazon-logo">
                    <img src="images/amazon_logo.png" alt="Amazon Logo">
                </div>
            </a>
        </div>
                
        <div class="location-text">
            <a href="#location">
                <div class="location-icon-address">
                    <span class="delivery-address">Delivering to Frederick 2172</span>
                          
                </div>    
                <div>
                    <i class="bi bi-geo-alt" id="location-icon-address"></i>
                    <span class="location-details">Update location</span>

                </div>
            </a>
        </div>
       
        <div class="search-bar-container">
            <div class="All">
                <button class="all-button">
                    <span>All</span>
                    <div class="all-drop-downfill">
                        <i class="bi bi-caret-down-fill"></i>
                    </div>        
                </button>
            </div>
            <input type="text" class="search-bar-input" placeholder="Search Amazon">
            <button class="search-button">
                <i class="bi bi-search"></i>
            </button>
        </div>
        <div class ="lang-account-order-cart">
            <div class="lang-container">
                <a href="#choose country">
                    <div class="lang-flag-container">
                        <div class="flag-icon">
                            <img src="images/United State flag.png" alt="US Flag" >
                        </div>
                        <div class="lang-select">
                            <span>EN</span>
                        </div>
                    </div>
                </a>
                <div class="drop-fill-icon">
                    <i class="bi bi-caret-down-fill"></i>
                </div>

                <div class="lang-container-tooltip">
                    <div class="lang-tooltip-pointer"></div>
                    <div class="tooltip-text">
                        <p>Change language</p>
                    </div>
                </div>
            </div>
            
            <div class="account-lists-container">
                <div class="account-text">
                    <a href="#account">
                        <div class="hello-sign" >
                            <span >Hello, Sign in</span>
                        </div>
                        <div class="account-lists-text">
                            <span>Account & Lists</span>
                        </div>
                    </a>         
                </div>
                <div class="down-fill-container">
                    <i class="bi bi-caret-down-fill"></i>
                </div>  
            </div>
            <div class="return-order-container">
                <a href="#returns & orders">
                    <div class="return-text">
                        <span>Returns</span>
                    </div>
                    <div class="order-text">
                        <span>& Orders</span>
                    </div>
                </a>
            </div>
            
            <div class="cart-num-text-container">
                <a href="#cart">
                    <div class="cart-container">
                        <div class="cart-image-num-container">
                                <div class="cart-image">
                                    <img src="images/cart-icon.png" alt="cart image">    
                                </div>
                                <div class="cart-num-items">
                                    <span>0</span>
                                </div>
                            </div>
                            <div class="cart-text">
                            <span >Cart</span> 
                        </div>
                    </div>    
                </a>
            </div>
        </div>
    </nav>

    <!--<div class="tooltip-box">
       This is a box with a pointer
    </div>--->    
</body>
</html>
